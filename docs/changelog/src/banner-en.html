<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap">
<style>
html,body{margin:0;width:1280px;height:640px;background:#0a0a13;font-family:Inter,system-ui,sans-serif;color:#fff;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(900px 500px at 15% 20%,rgba(139,92,246,.45),transparent 60%),radial-gradient(700px 500px at 90% 90%,rgba(216,185,106,.28),transparent 60%),#0a0a13}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at 30% 40%,#000,transparent 75%)}
.wrap{position:absolute;inset:0;padding:64px 80px;display:flex;flex-direction:column;justify-content:center}
.tag{font-weight:700;letter-spacing:.35em;text-transform:uppercase;color:#d8b96a;font-size:20px}
h1{font-family:Cinzel,serif;font-weight:800;font-size:92px;line-height:1.02;margin:18px 0 8px}
h1 span{color:#d8b96a}
.sub{font-size:28px;color:#c9c7e6;max-width:760px;line-height:1.35}
.chips{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.chip{padding:12px 20px;border-radius:999px;font-weight:700;font-size:22px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06)}
.v{background:rgba(139,92,246,.25);border-color:#8b5cf6}.t{background:rgba(20,184,166,.22);border-color:#14b8a6}.g{background:rgba(216,185,106,.2);border-color:#d8b96a}
.date{position:absolute;right:80px;top:64px;font-weight:700;letter-spacing:.2em;color:#9a96c8;font-size:20px}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="date">OCTOBER 9–10, 2026</div>
<div class="wrap">
  <div class="tag">CynClan.com · Update</div>
  <h1>Live Ranked<br><span>Queue</span></h1>
  <div class="sub">Follow the top 100 in 1v1 and 2v2 live – plus notifications, a verified check mark and four new languages.</div>
  <div class="chips">
    <div class="chip v">1v1</div><div class="chip t">2v2</div><div class="chip g">✓ Verified</div><div class="chip">🔔 Notifications</div><div class="chip">🌍 RU · IT · ES · KO</div>
  </div>
</div>
</body></html>
