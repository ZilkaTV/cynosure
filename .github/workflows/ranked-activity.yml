name: Ranked activity

# Feeds the activity statistics on the Live Ranked Queue page (scripts/collect-ranked-activity.mjs): per day and per hour how many ranked
# 1v1 / 2v2 games OpenFront had, from the public game list (counts only). Hourly; the first run reads the last 60 days.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ranked-activity
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Collect ranked activity
        env:
          HOT_API_SECRET: ${{ secrets.HOT_API_SECRET }}
        run: node scripts/collect-ranked-activity.mjs
