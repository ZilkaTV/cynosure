name: Discord role sync

# Assigns each registered CYN member the Discord role matching their
# highest all-time-wins tier (see scripts/discord-role-sync.mjs and the 9
# wins badges in src/lib/badges.ts). Every run recomputes the intended role
# from scratch and reconciles toward it - stateless, so no concurrency guard
# is needed (unlike refresh-details-cron.yml, which clamps against
# accumulating history and can race).
#
# 30-minute cadence matches engine-maintenance.yml - role updates aren't as
# time-sensitive as the stats cron's 5-minute cycle.

on:
  schedule:
    - cron: "*/30 * * * *"
  # GitHub's own scheduler is unreliable (gaps of up to 7 hours were seen, delaying the speedrun title
  # hand-over); the Cloudflare Worker's cron dispatches this every 30 minutes as the reliable trigger.
  repository_dispatch:
    types: [discord-role-sync]
  workflow_dispatch: {}

# A queued run replaces the previous queued one; never two at once.
concurrency:
  group: discord-role-sync
  cancel-in-progress: false

# Least privilege: this job only checks out the repo and talks to Supabase/
# Discord with its own secrets - it never pushes or touches issues/PRs. Explicit
# so it doesn't depend on the repo-wide default staying read-only.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Sync OpenFront clan members into cyn_members
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-clan-members.mjs

      - name: Sync Discord wins-tier roles
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Cloudflare D1 via the site's own Worker (member game lists + game details). Unset secret = scripts keep using Supabase.
          HOT_API_SECRET: ${{ secrets.HOT_API_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WINS_ROLE_IDS: ${{ vars.DISCORD_WINS_ROLES_IDS }}
        run: node scripts/discord-role-sync.mjs
