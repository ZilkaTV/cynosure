name: Compute clan score ledger

# Runs scripts/compute-clan-score-ledger.mjs, rebuilding cyn_clan_score_ledger
# (Win Score / Loss Score / Win-Loss Ratio per game, see src/lib/clanScore.ts)
# from cyn_member_games_cache. Same reliability reasoning as
# refresh-details-cron.yml: `schedule` is a fallback, the primary trigger is
# `repository_dispatch`, poked by the same Cloudflare Cron Trigger tick that
# already drives refresh-details/collect-metrics (see worker/index.js's
# scheduled()).
on:
  schedule:
    - cron: "0 * * * *"
  repository_dispatch:
    types: [clan-score-ledger]
  workflow_dispatch: {}

# A full recompute-and-upsert every run - two overlapping runs racing could
# interleave upserts inconsistently, so queue instead of running in parallel
# (same reasoning as refresh-details-cron.yml/collect-metrics.yml).
concurrency:
  group: clan-score-ledger
  cancel-in-progress: false

# Least privilege: this job only checks out the repo and talks to Supabase/
# Discord with its own secrets - it never pushes or touches issues/PRs. Explicit
# so it doesn't depend on the repo-wide default staying read-only.
permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Run compute-clan-score-ledger
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Cloudflare D1 (member game lists + game details). Unset token = scripts keep using Supabase.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 81e2b02027ef5ed61975a4e1a4283b6b
          D1_DATABASE_ID: ded1012f-9c6c-476b-8776-046d7abd99f4
        run: node scripts/compute-clan-score-ledger.mjs
