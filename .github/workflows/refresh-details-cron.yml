name: Refresh game-detail cache

# Runs scripts/refresh-details.mjs every ~5 minutes - matching the reference
# bot (github.com/deshack/openfront-discord-bot) this whole design was
# modeled on. Used to curl a Vercel serverless function instead; moved to a
# plain Node script run right here because Cloudflare Pages Functions (the
# replacement hosting) cap outbound fetch() calls at 50 per invocation on
# the free tier, and a single member's paginated game-history scan alone can
# issue 30-40+ sequential fetches - a GitHub Actions runner has no such
# limit, and this repo is public so Actions minutes are free regardless of
# frequency.
#
# Note: GitHub only guarantees scheduled workflows run at LEAST this often,
# not exactly on the dot - during high GitHub Actions load, a run can be
# delayed by a few minutes. That's fine here; the job is idempotent and
# self-catches-up next time regardless.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Without this, a manually-dispatched run (workflow_dispatch) overlapping
# the next scheduled tick - or two scheduled ticks overlapping if one runs
# long - lets two invocations of refresh-details.mjs race: each reads
# cyn_member_snapshots' historical max once at its own start, so a run that
# started before another run's write can clamp against a stale (too low)
# max and undo it. Confirmed directly: a manual dispatch overlapping the
# schedule dropped one member's persisted all_wins from 72 to 33 despite
# the same-run clamp meant to prevent exactly that. cancel-in-progress:
# false queues the next run instead of killing real in-flight writes.
concurrency:
  group: refresh-details-cron
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run refresh-details
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/refresh-details.mjs
