name: Engine maintenance (auto-vendor + Max Tiles backfill)

# Self-healing pipeline for Max Tiles: OpenFront ships engine updates
# periodically, and a game only replays correctly against the *exact*
# commit it was played on (see src/vendor/openfront-core/README.md). When a
# new commit shows up in real games and nothing's vendored for it yet, Max
# Tiles silently stays uncomputed for those games until someone notices and
# runs scripts/detect-engine-commits.mjs + vendor-engine.mjs by hand - which
# is exactly what kept happening. This runs both steps automatically:
#
#   1. scripts/auto-vendor-missing.mjs - finds engine commits real recent
#      games actually used that we don't have a vendored tree for, and
#      vendors each one (scripts/vendor-engine.mjs already self-verifies via
#      `tsc -b` before this workflow trusts the result enough to commit it).
#   2. scripts/backfill-tile-stats.mjs - computes Max Tiles for any recent
#      game still missing from the shared cache (with retries - most
#      failures here are transient, not permanent), whether that's because
#      step 1 just vendored something new or a fetch simply failed earlier.
#
# Runs every 30 minutes rather than daily - OpenFront can ship more than one
# engine update in a day, and a daily check meant games played any time after
# that morning's run showed no Max Tiles until the following day (confirmed
# directly: a game played the same afternoon a new commit shipped sat with a
# missing/uncomputed Max Tiles for hours). 30 minutes bounds that gap to
# something reasonable without hammering the OpenFront API or re-cloning
# OpenFrontIO from scratch every run (see the cache step below).
#
# A newly-vendored tree is pushed straight to master (guarded only by
# vendor-engine.mjs's own `tsc -b` self-check). This used to open a PR
# instead so a human could review the diff before third-party source went
# live - safer in theory, but GitHub Actions' default token isn't permitted
# to create PRs in this repo (org/repo setting, off by default), so that
# step failed outright on every run that found a new commit to vendor and
# skipped the Backfill Max Tiles step right after it - the pipeline was
# silently not backfilling on exactly the runs that mattered most. Pushing
# directly also just matches what already happens in practice: vendoring
# commits already land straight on master via manual runs, so the PR gate
# wasn't actually being exercised as a review step anyway.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # vendor-engine.mjs clones the full OpenFrontIO repo into .vendor-cache
      # (gitignored, ~1GB) and just `fetch`es it on later calls - without this
      # cache, running every 30 minutes would re-clone that from scratch on
      # every single run, which is both slow and wasteful.
      - uses: actions/cache@v4
        with:
          path: .vendor-cache
          key: vendor-cache-openfrontio

      - name: Check for new OpenFront engine commits and vendor them
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/auto-vendor-missing.mjs

      - name: Commit and push any newly-vendored engine tree
        run: |
          if [ -z "$(git status --porcelain src/vendor tsconfig.json src/lib/replaySimCore.ts)" ]; then
            echo "No new engine commits to vendor."
            exit 0
          fi

          NEW_DIRS=$(git status --porcelain src/vendor | awk '{print $2}' | grep -oE 'openfront-core-[0-9a-f]{7}' | sort -u | tr '\n' '-' | sed 's/-$//')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/vendor tsconfig.json src/lib/replaySimCore.ts
          git commit -m "Auto-vendor OpenFront engine commit(s): ${NEW_DIRS}"
          git push origin HEAD:master

      - name: Backfill Max Tiles for games still missing from the shared cache
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/backfill-tile-stats.mjs
